services:
  jishatlas:
    build: .
    image: jishatlas-website:latest
    container_name: jishatlas
    restart: unless-stopped
    # nginx listens on 80 inside the container; exposed on the host as 3002
    # (jishatlas.jishworks.in is forwarded to VPS:3002). Override with PORT=…
    ports:
      - "${PORT:-3002}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
