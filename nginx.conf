server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---- Hashed build assets: safe to cache forever ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- index.html: never cache, so deploys propagate immediately ----
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The favicon is an inline data: URI, so no file exists — answer quietly.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # ---- SPA fallback: client-side routes (/docs/introduction, /get-started, ...) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Basic security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
